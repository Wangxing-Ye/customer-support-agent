services:
  postgres:
    image: postgres:16-alpine
    container_name: pst-agent-postgres
    environment:
      POSTGRES_USER: pst
      POSTGRES_PASSWORD: pst
      POSTGRES_DB: pst_agent
    ports:
      # Host 5433 avoids clashing with a local Homebrew/system Postgres on 5432
      - "5433:5432"
    volumes:
      - pst_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pst -d pst_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pst_pg_data:
